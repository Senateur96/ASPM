<style>
/* Logo: Africa drawn in register lines, one line in ochre. Fonts: Archivo (condensed for titles), Source Serif 4 for reading, Overpass Mono for references.
   Concept: a public register. Docket numbers, ruled rows, an indigo map scale with ochre for whatever is selected.
   Condensed grotesque for headings and figures, a reading serif for summaries, a mono for references and dates. */
:root{
  --paper:#EDEFF2; --sheet:#FAFBFC; --ink:#0E1730; --ink2:#47516B; --rule:#C6CCD8; --rule2:#E0E4EB;
  --indigo:#24317F; --on-indigo:#FFFFFF; --ochre:#9E640A; --ochre-bg:#F5E9D2;

  --display:"Archivo","Arial Narrow",Arial,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"Overpass Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0B1020; --sheet:#121930; --ink:#E7EAF3; --ink2:#A3ABC1; --rule:#2E3858; --rule2:#1F2843;
  --indigo:#A9B5FF; --on-indigo:#0B1020; --ochre:#E5B356; --ochre-bg:#2C2413;
  --m0:#121930; --m0line:#56618C; --m1:#38448C; --m2:#6976D6; --m3:#B0BCFF; --sea:#0E1428; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0B1020; --sheet:#121930; --ink:#E7EAF3; --ink2:#A3ABC1; --rule:#2E3858; --rule2:#1F2843;

  --m0:#121930; --m0line:#56618C; --m1:#38448C; --m2:#6976D6; --m3:#B0BCFF; --sea:#0E1428; color-scheme:dark}
*{box-sizing:border-box}

const GCAT={F:["Finance durable","Sustainable finance"],C:["Climat","Climate"],B:["Biodiversité","Biodiversity"],D:["Déchets et économie circulaire","Waste and circular economy"],S:["Social et droits humains","Social and human rights"],J:["Droit et méthode","Law and method"]};
const GLOSS=[
["F","Taxonomie verte","Green taxonomy","Système de classification qui fixe, par des critères techniques, les activités économiques considérées comme contribuant à un objectif environnemental. Il sert de référence aux produits financiers verts et à la publication d'informations. En Afrique, l'Afrique du Sud, le Rwanda et le Kenya en ont publié une.","Classification system that sets technical criteria for economic activities considered to contribute to an environmental objective. It is a reference for green financial products and disclosure. In Africa, South Africa, Rwanda and Kenya have published one."],
["F","ESG","ESG","Environnement, social et gouvernance. Les trois familles de critères extra-financiers utilisées pour analyser une entreprise ou un investissement.","Environmental, social and governance. The three families of non-financial criteria used to analyse a company or an investment."],
["F","Finance durable","Sustainable finance","Ensemble des pratiques qui intègrent les critères environnementaux, sociaux et de gouvernance dans les décisions de financement et d'investissement.","Practices that integrate environmental, social and governance criteria into financing and investment decisions."],
["F","Normes IFRS S1 et S2","IFRS S1 and S2","Normes de publication d'informations de durabilité publiées par l'ISSB en juin 2023. IFRS S1 couvre les risques et opportunités liés à la durabilité en général, IFRS S2 ceux liés au climat. Le Ghana et le Nigeria ont fixé un calendrier d'adoption.","Sustainability disclosure standards issued by the ISSB in June 2023. IFRS S1 covers sustainability-related risks and opportunities in general, IFRS S2 climate-related ones. Ghana and Nigeria have set adoption timelines.","https://www.ifrs.org/groups/international-sustainability-standards-board/"],
["F","ISSB","ISSB","International Sustainability Standards Board. Conseil créé par la Fondation IFRS en novembre 2021 pour établir une base mondiale de normes de publication d'informations de durabilité.","International Sustainability Standards Board. Board set up by the IFRS Foundation in November 2021 to establish a global baseline of sustainability disclosure standards.","https://www.ifrs.org/groups/international-sustainability-standards-board/"],
["F","TCFD","TCFD","Task Force on Climate-related Financial Disclosures. Ses recommandations de 2017 organisent la publication climatique en quatre piliers : gouvernance, stratégie, gestion des risques, indicateurs et objectifs. Elles sont reprises dans IFRS S2 et le groupe de travail a été dissous en 2023.","Task Force on Climate-related Financial Disclosures. Its 2017 recommendations organise climate disclosure into four pillars: governance, strategy, risk management, metrics and targets. They are built into IFRS S2 and the task force was disbanded in 2023."],
["F","Risques physiques","Physical risks","Risques financiers liés aux effets du changement climatique : événements extrêmes (inondations, sécheresses, cyclones) ou évolutions lentes (hausse des températures, du niveau de la mer).","Financial risks arising from the effects of climate change: extreme events (floods, droughts, cyclones) or gradual shifts (rising temperatures and sea levels)."],
["F","Risques de transition","Transition risks","Risques financiers liés au passage vers une économie bas carbone : nouvelles règles, prix du carbone, évolution des technologies, des marchés et des attentes du public.","Financial risks arising from the shift to a low-carbon economy: new rules, carbon prices, changes in technology, markets and public expectations."],
["F","Double matérialité","Double materiality","Approche qui examine à la fois l'effet des enjeux de durabilité sur la situation financière de l'entreprise et l'effet de l'entreprise sur l'environnement et la société. Les normes ISSB retiennent la seule matérialité financière.","Approach that considers both the effect of sustainability issues on a company's financial position and the company's effect on the environment and society. ISSB standards use financial materiality only."],
["F","Obligation verte, sociale ou durable","Green, social or sustainability bond","Titre de dette dont le produit finance des projets environnementaux, sociaux, ou les deux. Les Principes de l'ICMA et les guides des régulateurs de marché fixent les règles d'usage des fonds, de sélection des projets et de reporting.","Debt security whose proceeds fund environmental projects, social projects, or both. The ICMA Principles and market regulators' guides set rules on use of proceeds, project selection and reporting.","https://www.icmagroup.org/sustainable-finance/"],
["F","Obligation liée au développement durable","Sustainability-linked bond","Obligation dont les conditions financières, souvent le coupon, varient selon que l'émetteur atteint ou non des objectifs de performance de durabilité fixés à l'avance. Le produit n'est pas affecté à des projets précis.","Bond whose financial terms, often the coupon, change depending on whether the issuer meets predefined sustainability performance targets. Proceeds are not earmarked for specific projects."],
["F","Principes de l'ICMA","ICMA Principles","Lignes directrices volontaires publiées par l'International Capital Market Association pour les obligations vertes (depuis 2014), sociales, durables et liées au développement durable. Les guides tunisien, marocain, ouest-africain et d'Afrique centrale s'y réfèrent.","Voluntary guidelines published by the International Capital Market Association for green bonds (since 2014), social, sustainability and sustainability-linked bonds. The Tunisian, Moroccan, West African and Central African guides refer to them.","https://www.icmagroup.org/sustainable-finance/"],
["F","Lignes directrices prudentielles","Prudential guidance","Texte par lequel une banque centrale ou un superviseur précise ses attentes envers les établissements supervisés. Sa force juridique dépend du droit national ; ce registre le classe comme indicatif sauf si le texte se déclare obligatoire.","Document by which a central bank or supervisor sets out its expectations of supervised institutions. Its legal force depends on national law; this register classes it as guidance unless the text states it is mandatory."],
["F","Analyse de scénarios et test de résistance climatique","Climate scenario analysis and stress testing","Exercices qui mesurent l'effet de trajectoires climatiques hypothétiques sur les bilans des institutions financières. Les lignes directrices de la Banque de Tanzanie de 2022 les demandent explicitement.","Exercises that measure the effect of hypothetical climate pathways on financial institutions' balance sheets. The Bank of Tanzania's 2022 guidelines explicitly require them."],
["F","NGFS","NGFS","Network for Greening the Financial System. Réseau de banques centrales et de superviseurs créé en décembre 2017 pour intégrer les risques climatiques et environnementaux dans la supervision et la politique monétaire.","Network for Greening the Financial System. Network of central banks and supervisors created in December 2017 to integrate climate and environmental risks into supervision and monetary policy.","https://www.ngfs.net/"],
["F","SBFN","SBFN","Sustainable Banking and Finance Network. Réseau de régulateurs et d'associations bancaires de pays émergents, dont le secrétariat est assuré par la SFI. Il suit les cadres de finance durable de ses membres.","Sustainable Banking and Finance Network. Network of regulators and banking associations from emerging markets, with a secretariat hosted by the IFC. It tracks members' sustainable finance frameworks.","https://data.sbfnetwork.org/"],
["F","Écoblanchiment","Greenwashing","Présentation trompeuse d'un produit, d'une entreprise ou d'un placement comme plus favorable à l'environnement qu'il ne l'est. Les taxonomies et les règles de publication visent notamment à le limiter.","Misleading presentation of a product, company or investment as more environmentally friendly than it is. Taxonomies and disclosure rules aim, among other things, to limit it."],
["F","Finance mixte","Blended finance","Utilisation de fonds publics ou philanthropiques pour réduire le risque d'un projet et attirer des capitaux privés.","Use of public or philanthropic funds to reduce a project's risk and attract private capital."],
["F","Entité d'intérêt public","Public interest entity","Catégorie d'entités soumises à des obligations comptables renforcées, en général sociétés cotées, banques, assureurs et grandes entreprises. Sa définition exacte relève de chaque pays.","Category of entities subject to stricter reporting duties, generally listed companies, banks, insurers and large companies. The exact definition is set by each country."],
["C","Accord de Paris","Paris Agreement","Traité adopté en décembre 2015 dans le cadre de la CCNUCC et entré en vigueur le 4 novembre 2016. Il vise à contenir la hausse de la température moyenne nettement en dessous de 2 °C et à poursuivre l'action pour la limiter à 1,5 °C.","Treaty adopted in December 2015 under the UNFCCC, in force since 4 November 2016. It aims to hold the rise in average temperature well below 2 °C and to pursue efforts to limit it to 1.5 °C.","https://unfccc.int/process-and-meetings/the-paris-agreement"],
["C","Contribution déterminée au niveau national (CDN)","Nationally determined contribution (NDC)","Plan climatique que chaque partie à l'Accord de Paris soumet et actualise tous les cinq ans. Les CDN sont publiées sur le registre de la CCNUCC.","Climate plan that each party to the Paris Agreement submits and updates every five years. NDCs are published on the UNFCCC registry.","https://unfccc.int/NDCREG"],
["C","Stratégie de long terme","Long-term strategy","Stratégie de développement à faibles émissions à l'horizon du milieu du siècle, que l'Accord de Paris invite les parties à communiquer.","Mid-century low-emission development strategy that the Paris Agreement invites parties to communicate."],
["C","Plan national d'adaptation (PNA)","National adaptation plan (NAP)","Processus établi dans le cadre de la CCNUCC pour identifier les besoins d'adaptation à moyen et long terme et les intégrer dans la planification nationale.","Process established under the UNFCCC to identify medium- and long-term adaptation needs and integrate them into national planning."],
["C","Article 6 de l'Accord de Paris","Article 6 of the Paris Agreement","Disposition qui permet aux pays de coopérer pour atteindre leurs CDN, notamment par le transfert international de résultats d'atténuation. Plusieurs pays, dont le Kenya, ont adopté des règles qui encadrent ces transferts.","Provision allowing countries to cooperate to achieve their NDCs, including through international transfers of mitigation outcomes. Several countries, including Kenya, have adopted rules governing these transfers."],
["C","Ajustement correspondant","Corresponding adjustment","Écriture comptable par laquelle le pays qui cède des réductions d'émissions les retire de son propre bilan, afin qu'elles ne soient pas comptées deux fois.","Accounting entry by which the country transferring emission reductions removes them from its own balance, so they are not counted twice."],
["C","Crédit carbone","Carbon credit","Unité représentant une tonne d'équivalent CO2 évitée ou retirée de l'atmosphère, certifiée selon une méthode reconnue et échangeable.","Unit representing one tonne of CO2 equivalent avoided or removed from the atmosphere, certified under a recognised method and tradable."],
["C","Marché volontaire du carbone","Voluntary carbon market","Marché où des entreprises ou des particuliers achètent des crédits carbone sans y être obligés par la loi, souvent pour compenser leurs émissions.","Market where companies or individuals buy carbon credits without a legal obligation, often to offset their emissions."],
["C","Taxe carbone","Carbon tax","Prélèvement fiscal proportionnel aux émissions de gaz à effet de serre. L'Afrique du Sud applique la sienne depuis le 1er juin 2019.","Tax proportional to greenhouse gas emissions. South Africa has applied its own since 1 June 2019."],
["C","Budget carbone","Carbon budget","Quantité maximale d'émissions autorisée sur une période donnée, pour un pays, un secteur ou une entreprise. La loi climat sud-africaine de 2024 en attribue aux entreprises.","Maximum amount of emissions allowed over a given period for a country, sector or company. South Africa's 2024 climate law allocates them to companies."],
["C","Neutralité carbone","Net zero","Situation où les émissions de gaz à effet de serre restantes sont compensées par des absorptions équivalentes. La loi nigériane de 2021 fixe cet objectif entre 2050 et 2070.","State in which remaining greenhouse gas emissions are balanced by equivalent removals. Nigeria's 2021 law sets this target between 2050 and 2070."],
["C","MRV","MRV","Mesure, notification et vérification. Système qui permet de suivre les émissions et les actions climatiques de manière fiable et comparable.","Measurement, reporting and verification. System for tracking emissions and climate action reliably and comparably."],
["C","Pertes et préjudices","Loss and damage","Dommages causés par le changement climatique qui ne peuvent être évités par l'atténuation ni par l'adaptation. Un fonds dédié a été décidé à la COP27 (2022) et rendu opérationnel à la COP28 (2023).","Climate change damage that can be avoided neither by mitigation nor by adaptation. A dedicated fund was agreed at COP27 (2022) and made operational at COP28 (2023)."],
["C","Partenariat pour une transition énergétique juste (JETP)","Just Energy Transition Partnership (JETP)","Accord de financement entre un pays et un groupe de partenaires pour accélérer la sortie des énergies fossiles. L'Afrique du Sud a conclu le premier en novembre 2021, le Sénégal en juin 2023.","Financing agreement between a country and a group of partners to speed up the move away from fossil fuels. South Africa signed the first in November 2021, Senegal in June 2023."],
["C","Transition juste","Just transition","Approche qui vise à rendre le passage vers une économie bas carbone équitable pour les travailleurs et les communautés concernés.","Approach that aims to make the shift to a low-carbon economy fair for the workers and communities affected."],
["B","Convention sur la diversité biologique (CDB)","Convention on Biological Diversity (CBD)","Traité ouvert à la signature à Rio en 1992 et entré en vigueur en 1993. Ses objectifs sont la conservation de la biodiversité, son utilisation durable et le partage juste des avantages tirés des ressources génétiques.","Treaty opened for signature in Rio in 1992 and in force since 1993. Its objectives are conserving biodiversity, using it sustainably and sharing fairly the benefits from genetic resources.","https://www.cbd.int/"],
["B","Stratégie et plan d'action nationaux pour la biodiversité (SPANB)","National biodiversity strategy and action plan (NBSAP)","Principal instrument de mise en œuvre de la CDB au niveau national. Les pays les actualisent pour s'aligner sur le Cadre mondial de Kunming-Montréal.","Main instrument for implementing the CBD at national level. Countries are updating them to align with the Kunming-Montreal Global Framework.","https://www.cbd.int/nbsap/"],
["B","Cadre mondial de la biodiversité de Kunming-Montréal","Kunming-Montreal Global Biodiversity Framework","Adopté en décembre 2022 à la COP15. Il fixe 23 cibles pour 2030 et quatre objectifs pour 2050.","Adopted in December 2022 at COP15. It sets 23 targets for 2030 and four goals for 2050.","https://www.cbd.int/gbf/"],
["B","Cible 30x30","30x30 target","Cible 3 du Cadre de Kunming-Montréal : conserver d'ici 2030 au moins 30 % des zones terrestres, des eaux intérieures et des zones marines et côtières.","Target 3 of the Kunming-Montreal Framework: conserve by 2030 at least 30% of land, inland waters and marine and coastal areas.","https://www.cbd.int/gbf/targets/3/"],
["B","Aire protégée","Protected area","Espace géographique délimité, reconnu et géré par des moyens juridiques ou autres afin d'assurer la conservation de la nature à long terme. L'UICN distingue des catégories allant de Ia (réserve naturelle intégrale) à VI (utilisation durable des ressources).","Clearly defined geographical space, recognised and managed through legal or other means to achieve long-term conservation of nature. IUCN distinguishes categories from Ia (strict nature reserve) to VI (sustainable use of resources)."],
["B","Accès et partage des avantages (APA)","Access and benefit sharing (ABS)","Règles qui encadrent l'accès aux ressources génétiques et le partage juste et équitable des avantages tirés de leur utilisation. Le Protocole de Nagoya, adopté en 2010, est en vigueur depuis 2014.","Rules governing access to genetic resources and the fair and equitable sharing of benefits from their use. The Nagoya Protocol, adopted in 2010, has been in force since 2014.","https://www.cbd.int/abs/"],
["B","CITES","CITES","Convention sur le commerce international des espèces de faune et de flore sauvages menacées d'extinction, signée en 1973 et en vigueur depuis 1975. Elle soumet le commerce des espèces inscrites à des permis.","Convention on International Trade in Endangered Species of Wild Fauna and Flora, signed in 1973 and in force since 1975. It makes trade in listed species subject to permits.","https://cites.org/"],
["B","Espèce exotique envahissante","Invasive alien species","Espèce introduite hors de son aire naturelle dont l'établissement menace les écosystèmes, les habitats ou les espèces locales. La loi sud-africaine de 2004 sur la biodiversité prévoit leur contrôle.","Species introduced outside its natural range whose spread threatens local ecosystems, habitats or species. South Africa's 2004 Biodiversity Act provides for their control."],
["B","Convention de Maputo","Maputo Convention","Version révisée, adoptée en 2003, de la Convention africaine de 1968 sur la conservation de la nature et des ressources naturelles. Elle est en vigueur depuis 2016 pour les États qui l'ont ratifiée.","Revised version, adopted in 2003, of the 1968 African Convention on the Conservation of Nature and Natural Resources. It has been in force since 2016 for the states that ratified it."],
["D","Économie circulaire","Circular economy","Modèle économique qui garde les produits et les matières en usage le plus longtemps possible par la réduction, le réemploi, la réparation et le recyclage, plutôt que de les extraire, consommer et jeter.","Economic model that keeps products and materials in use as long as possible through reduction, reuse, repair and recycling, rather than extracting, consuming and discarding them."],
["D","Hiérarchie des déchets","Waste hierarchy","Ordre de priorité des modes de gestion : prévention, réemploi, recyclage, autres valorisations, puis élimination en dernier recours.","Order of priority for waste management: prevention, reuse, recycling, other recovery, then disposal as a last resort."],
["D","Responsabilité élargie du producteur (REP)","Extended producer responsibility (EPR)","Principe qui rend le producteur ou l'importateur responsable, financièrement et parfois matériellement, de la gestion de ses produits et emballages en fin de vie. L'Afrique du Sud (2020) et le Kenya (2024) l'ont rendu obligatoire.","Principle that makes the producer or importer responsible, financially and sometimes physically, for managing its products and packaging at end of life. South Africa (2020) and Kenya (2024) have made it mandatory."],
["D","Plastique à usage unique","Single-use plastic","Produit en plastique conçu pour être utilisé une seule fois ou pendant peu de temps avant d'être jeté, comme les sacs, pailles, gobelets ou couverts.","Plastic product designed to be used once or for a short time before being thrown away, such as bags, straws, cups or cutlery."],
["D","Seuil d'épaisseur","Thickness threshold","Critère utilisé par de nombreuses interdictions pour distinguer les sacs visés, exprimé en microns. Le décret malgache de 2014 vise par exemple les sacs de 50 microns ou moins.","Criterion used by many bans to define which bags are covered, expressed in microns. Madagascar's 2014 decree, for instance, covers bags of 50 microns or less."],
["D","Biodégradable et compostable","Biodegradable and compostable","Un matériau biodégradable est décomposé par des micro-organismes, sans garantie de délai ni de conditions. Un matériau compostable se décompose dans des conditions de compostage définies par une norme. Les textes nationaux ne donnent pas toujours la même définition.","A biodegradable material is broken down by micro-organisms, with no guarantee of time or conditions. A compostable material breaks down under composting conditions defined by a standard. National texts do not always use the same definition."],
["D","Convention de Bâle","Basel Convention","Traité mondial adopté en 1989, en vigueur depuis 1992, qui contrôle les mouvements transfrontières de déchets dangereux et de certains déchets plastiques.","Global treaty adopted in 1989, in force since 1992, which controls transboundary movements of hazardous wastes and certain plastic wastes.","https://www.basel.int/"],
["D","Convention de Bamako","Bamako Convention","Traité africain adopté en 1991 et en vigueur depuis 1998. Il interdit l'importation en Afrique de déchets dangereux et va plus loin que la Convention de Bâle sur plusieurs points.","African treaty adopted in 1991 and in force since 1998. It bans the import of hazardous wastes into Africa and goes further than the Basel Convention on several points.","https://unep.org/bamako-convention"],
["S","Principes directeurs des Nations unies (UNGP)","UN Guiding Principles on Business and Human Rights (UNGPs)","Cadre approuvé en juin 2011 par le Conseil des droits de l'homme. Trois piliers : l'obligation de protéger de l'État, la responsabilité de respecter des entreprises et l'accès à des voies de recours.","Framework endorsed in June 2011 by the Human Rights Council. Three pillars: the state duty to protect, the corporate responsibility to respect and access to remedy.","https://www.ohchr.org/sites/default/files/documents/publications/guidingprinciplesbusinesshr_en.pdf"],
["S","Plan d'action national entreprises et droits de l'homme","National action plan on business and human rights","Document par lequel un État définit les mesures qu'il prendra pour mettre en œuvre les Principes directeurs des Nations unies. En Afrique, le Kenya, l'Ouganda, le Nigeria et le Liberia en ont adopté un.","Document in which a state sets out the measures it will take to implement the UN Guiding Principles. In Africa, Kenya, Uganda, Nigeria and Liberia have adopted one.","https://globalnaps.org/"],
["S","Devoir de vigilance","Human rights due diligence","Processus par lequel une entreprise identifie, prévient, atténue et rend compte des atteintes aux droits humains et à l'environnement liées à ses activités et à sa chaîne de valeur.","Process by which a company identifies, prevents, mitigates and accounts for harm to human rights and the environment linked to its operations and value chain."],
["S","Principes et droits fondamentaux au travail","Fundamental principles and rights at work","Cinq catégories reconnues par l'OIT : liberté syndicale, élimination du travail forcé, abolition du travail des enfants, non-discrimination, et depuis 2022 un milieu de travail sûr et salubre. Elles reposent sur dix conventions fondamentales.","Five categories recognised by the ILO: freedom of association, elimination of forced labour, abolition of child labour, non-discrimination, and since 2022 a safe and healthy working environment. They rest on ten fundamental conventions.","https://www.ilo.org/"],
["S","Consentement libre, informé et préalable (CLIP)","Free, prior and informed consent (FPIC)","Droit des peuples autochtones, reconnu par la Déclaration des Nations unies de 2007, d'accepter ou de refuser un projet qui les concerne, avant sa réalisation et en connaissance de cause.","Right of indigenous peoples, recognised by the 2007 UN Declaration, to give or withhold consent to a project affecting them, before it starts and with full information."],
["S","Étude d'impact environnemental et social (EIES)","Environmental and social impact assessment (ESIA)","Procédure préalable qui évalue les effets d'un projet sur l'environnement et les populations et fixe les mesures pour les éviter, les réduire ou les compenser.","Prior procedure that assesses a project's effects on the environment and people and sets measures to avoid, reduce or offset them."],
["J","Contraignant, indicatif, volontaire","Binding, guidance, voluntary","Classement de ce registre. Contraignant : le texte crée des obligations sanctionnables (loi, décret, règlement, directive). Indicatif : texte public qui fixe des objectifs ou des attentes sans sanction propre (stratégie, politique, lignes directrices, feuille de route). Volontaire : texte qui s'applique à ceux qui y adhèrent.","This register's classification. Binding: the text creates enforceable obligations (act, decree, regulation, directive). Guidance: a public text that sets objectives or expectations without its own sanctions (strategy, policy, guidelines, roadmap). Voluntary: a text that applies to those who sign up."],
["J","Dédié, intégré","Dedicated, integrated","Un texte est dédié quand le thème est son objet principal. Il est intégré quand le thème fait l'objet d'au moins une disposition identifiable dans un texte plus large, comme un code de l'environnement. Une simple mention ne suffit pas.","A text is dedicated when the theme is its main subject. It is integrated when the theme is covered by at least one identifiable provision in a broader text, such as an environmental code. A passing mention is not enough."],
["J","Directement applicable","Directly applicable","Se dit d'un acte régional qui produit ses effets dans le droit des États membres sans mesure nationale. Les traités de la CEDEAO et de la CEMAC le prévoient pour leurs règlements ; ceux du COMESA, de l'EAC et de la SADC exigent une mesure nationale.","Said of a regional act that takes effect in member states' law without national measures. The ECOWAS and CEMAC treaties provide for this for their regulations; the COMESA, EAC and SADC treaties require a national measure."],
["J","Ratification","Ratification","Acte par lequel un État exprime son consentement à être lié par un traité. Dans beaucoup de pays, une loi autorise d'abord le gouvernement à ratifier.","Act by which a state expresses its consent to be bound by a treaty. In many countries, a law first authorises the government to ratify."],
["J","Journal officiel","Official gazette","Publication de l'État où paraissent les lois et règlements. La publication conditionne en général leur opposabilité. Les pays anglophones parlent de Gazette, les lusophones de Boletim da República.","State publication in which acts and regulations appear. Publication generally determines when they can be enforced. English-speaking countries use the term Gazette, Portuguese-speaking ones Boletim da República."],
["J","Promulgation","Promulgation","Acte par lequel le chef de l'État constate l'adoption d'une loi et la rend exécutoire. Au Maroc, elle se fait par dahir ; dans les pays anglophones, on parle d'assentiment présidentiel.","Act by which the head of state records the adoption of a law and makes it enforceable. In Morocco this is done by dahir; in English-speaking countries it is presidential assent."],
["J","Entrée en vigueur","Entry into force","Date à partir de laquelle un texte produit ses effets. Elle peut être fixée par le texte, par un acte ultérieur, ou par étapes, comme pour la loi climat sud-africaine de 2024.","Date from which a text takes effect. It may be set by the text itself, by a later act, or in stages, as with South Africa's 2024 climate law."],
["J","Loi-cadre","Framework law","Loi qui fixe des principes et des objectifs généraux et renvoie leur mise en œuvre à des textes d'application.","Law that sets general principles and objectives and leaves their implementation to secondary texts."],
["J","Décret, arrêté, règlement","Decree, order, regulations","Textes pris par le pouvoir exécutif pour appliquer une loi ou dans son domaine propre. Les termes anglais Regulations, Order ou Statutory Instrument désignent des catégories proches.","Texts adopted by the executive to apply a law or within its own remit. The English terms Regulations, Order or Statutory Instrument cover similar categories."]
];

const ABOUT2={
fr:{why_h:"Pourquoi ce registre",why:[
"Depuis une vingtaine d'années, les États africains adoptent un nombre croissant de textes sur le climat, la biodiversité, les déchets et la finance durable. Ces textes existent, mais ils sont dispersés : journaux officiels nationaux, sites de banques centrales et de régulateurs de marché, bases internationales dont chacune ne couvre qu'un thème. Beaucoup ne sont publiés que dans une langue, en arabe, en anglais, en français ou en portugais.",
"Cette dispersion a des effets concrets. Un investisseur qui étudie un projet au Sénégal ou en Zambie doit reconstituer seul le cadre applicable. Une administration qui prépare une loi voit mal ce que ses voisins ont déjà adopté. Les chercheurs et les journalistes n'ont pas de base commune pour comparer. Les grands suivis internationaux des politiques climatiques ne retiennent souvent qu'une poignée de pays africains, ce qui donne une image incomplète, et souvent trop pauvre, de l'action publique sur le continent.",
"Le registre part d'une règle simple : un texte, une source, une force juridique. Il couvre les 55 États membres de l'Union africaine et leurs organisations régionales, en français et en anglais. Il décrit ce qui a été adopté sans attribuer de note, et il distingue toujours ce qui n'a pas été trouvé de ce qui n'a pas encore été cherché.",
"Il s'adresse aux investisseurs et aux analystes ESG, aux administrations et aux régulateurs, aux chercheurs, aux organisations de la société civile et aux journalistes, c'est-à-dire à tous ceux qui ont besoin de savoir, pièces à l'appui, ce que dit le droit."],
who_h:"Le fondateur",name:"Sékou Oumar Sylla",role:"Fondateur et éditeur",
bio:[
"Sékou Oumar Sylla est un professionnel guinéen des données et du reporting ESG, établi en France. Il travaille à Arkéa Capital, la filiale de capital-investissement du Crédit Mutuel Arkéa, où il conduit le reporting réglementaire ESG. Il a auparavant exercé chez BPCE, chez Rothschild & Co Asset Management et chez Bureau Veritas.",
"En 2024, il a fondé Sustainability Infographics, l'une des pages LinkedIn indépendantes consacrées à la durabilité les plus suivies au monde. Animée par une vingtaine de bénévoles, la page réunit plus de 220 000 abonnés et ses publications ont touché plus de 190 millions de personnes. Son objectif est de rendre les données de durabilité accessibles au-delà des cercles spécialisés.",
"Diplômé du Groupe ISCAE à Casablanca, l'une des principales écoles de commerce du Maroc, où il a suivi le programme Grande École en finance d'entreprise, il est également titulaire d'un master recherche de l'Université de Lille et de deux mastères, en finance durable et en management de la RSE. Il détient le Sustainable Investing Certificate du CFA Institute et la certification AMF Finance durable.",
"Il est membre du centre de recherche sur le leadership climatique de l'Université d'Oxford (Oxford University Centre for Research on Climate Leadership). En 2021, il a été sélectionné parmi les cinquante jeunes francophones du programme « 50 jeunes engagés pour le climat », soutenu par l'Organisation internationale de la Francophonie à travers l'Institut de la Francophonie pour le développement durable. Ancien membre du comité jeunesse de 1Planet4All, projet de justice climatique cofinancé par l'Union européenne et conduit par ACTED et Convergences, il est actionnaire de Team for the Planet, entreprise financée par des citoyens qui crée des sociétés diffusant en libre accès des innovations contre les gaz à effet de serre. Il est aussi animateur de la Fresque du Climat.",
"Auteur de livres et d'articles, il a été lauréat en 2021 du Prix Jeunes Écrivains RFI-AUF et a participé la même année au programme Crossroads Emerging Leaders de Harvard."],
ed_h:"Édition et licence",ed:[
"Le registre est édité à titre personnel par son fondateur. Les données compilées et les textes rédigés pour le site sont placés sous licence Creative Commons Attribution 4.0 (CC BY 4.0). Les textes officiels restent la propriété de leurs auteurs et ne sont pas hébergés ici.",

"Cette version est hébergée sur claude.ai (Anthropic). Les mentions légales complètes et un formulaire de signalement accompagneront la mise en ligne sur un domaine propre ; chaque signalement sera vérifié sur le texte officiel avant toute modification."],
logo_h:"Le logo",logo:"L'Afrique tracée en lignes de registre. Chaque ligne évoque une entrée ; la ligne ocre, à hauteur du golfe de Guinée et de l'équateur, figure l'entrée que l'on consulte.",photo_alt:"Portrait de Sékou Oumar Sylla"},
en:{why_h:"Why this register",why:[
"Over the past twenty years, African states have adopted a growing number of texts on climate, biodiversity, waste and sustainable finance. These texts exist, but they are scattered across national gazettes, the websites of central banks and market regulators, and international databases that each cover a single theme. Many are published in only one language, whether Arabic, English, French or Portuguese.",
"This fragmentation has practical consequences. An investor assessing a project in Senegal or Zambia has to piece together the applicable framework alone. A government drafting a law struggles to see what its neighbours have already adopted. Researchers and journalists lack a common basis for comparison. Major international trackers of climate policy often include only a handful of African countries, which gives an incomplete, and often too thin, picture of public action on the continent.",
"The register rests on a simple rule: one text, one source, one legal force. It covers the 55 African Union member states and their regional organisations, in English and French. It describes what has been adopted without assigning scores, and it always separates what was not found from what has not yet been searched.",
"It is built for ESG investors and analysts, governments and regulators, researchers, civil society organisations and journalists: anyone who needs to know, with evidence, what the law says."],
who_h:"The founder",name:"Sékou Oumar Sylla",role:"Founder and editor",
bio:[
"Sékou Oumar Sylla is a Guinean ESG data and reporting professional based in France. He works at Arkéa Capital, the private equity subsidiary of Crédit Mutuel Arkéa, where he leads regulatory ESG reporting. He previously worked at BPCE, Rothschild & Co Asset Management and Bureau Veritas.",
"In 2024 he founded Sustainability Infographics, one of the most-followed independent LinkedIn pages dedicated to sustainability. Run with some twenty volunteers, the page has more than 220,000 followers and its posts have reached more than 190 million people. Its aim is to make sustainability data accessible beyond specialist circles.",
"He graduated from Groupe ISCAE in Casablanca, one of Morocco's leading business schools, where he completed the Grande École programme in corporate finance, and holds a research master's degree from the Université de Lille as well as two specialised master's degrees, in sustainable finance and in CSR management. He holds the CFA Institute Sustainable Investing Certificate and the AMF Sustainable Finance certification.",
"He is a member of the Oxford University Centre for Research on Climate Leadership. In 2021 he was selected among the fifty young French speakers of the \"50 jeunes engagés pour le climat\" programme, supported by the Organisation internationale de la Francophonie through its Institute for Sustainable Development (IFDD). A former member of the Youth Committee of 1Planet4All, an EU co-funded climate justice project led by ACTED and Convergences, he is a shareholder in Team for the Planet, a citizen-funded venture builder that creates companies deploying open-source innovations against greenhouse gas emissions. He is also a Climate Fresk facilitator.",
"An author of books and articles, he won the RFI-AUF Young Writers Prize in 2021 and took part the same year in Harvard's Crossroads Emerging Leaders Program."],
ed_h:"Publisher and licence",ed:[
"The register is published in a personal capacity by its founder. The compiled data and the texts written for the site are released under the Creative Commons Attribution 4.0 licence (CC BY 4.0). Official texts remain the property of their authors and are not hosted here.",
"To cite the register: Sylla, S. O. (2026). African Sustainability Policy Monitor. Data as of 31 October 2026.",
"This version is hosted on claude.ai (Anthropic). Full legal notices and a reporting form will come with the move to a dedicated domain; every report will be checked against the official text before any change."],
logo_h:"The logo",logo:"Africa drawn in register lines. Each line stands for an entry; the ochre line, level with the Gulf of Guinea and the equator, marks the entry being consulted.",photo_alt:"Portrait of Sékou Oumar Sylla"}

<p>Le registre recense les textes publics de durabilité des 55 États membres de l'Union africaine, selon la liste publiée par l'UA, ainsi que les textes de l'UA et des organisations régionales. Il couvre cinq thèmes, présentés avec leur périmètre sur la page Thèmes.</p>
<h3>Ce qui entre dans le registre</h3>
<p>Un texte est retenu s'il est adopté par une autorité publique : constitution, loi, ordonnance, décret, arrêté, règlement, directive ou ligne directrice d'une banque centrale, d'un régulateur ou d'une bourse, stratégie ou politique nationale. Un engagement volontaire n'est retenu que s'il est porté ou signé par une autorité publique. Les chartes d'associations professionnelles sans validation publique et les projets de texte ne sont pas retenus.</p>
<h3>Comment chaque entrée est établie</h3>
<ul><li>Identification du texte dans les sources officielles du pays, puis dans les bases de référence.</li><li>Ouverture du texte ou de sa notice pour relever l'intitulé exact, le numéro, la date et l'autorité.</li><li>Classement de la force juridique et du caractère dédié ou intégré pour chaque thème.</li><li>Rédaction d'un résumé factuel en français et en anglais, sans appréciation de l'ambition du texte.</li><li>Attribution d'un niveau de preuve selon la source retenue.</li></ul>
<h3>Barème de la carte</h3>
<p>Pour un thème donné, un pays prend le niveau le plus élevé atteint par ses textes nationaux : texte dédié et contraignant, texte dédié indicatif ou volontaire, disposition dans un texte plus large. Un pays sans texte recensé est « non encore évalué ». Le registre ne qualifie jamais un pays de « sans politique » tant que la recherche n'est pas complète. La vue d'ensemble compte le nombre de thèmes renseignés.</p>
<p>La carte décrit l'existence et la nature juridique des textes. Elle ne note ni leur ambition ni leur mise en œuvre. Un texte abrogé ne colore pas la carte. Les textes régionaux ne colorent pas les pays ; ils figurent sur la fiche de chaque État membre et la carte peut hachurer la zone concernée.</p>
<h3>Niveaux de preuve</h3>
<p>Une source officielle est publiée par l'autorité émettrice, un parlement ou un journal officiel. Une base juridique de référence est un registre reconnu : FAOLEX, LEAP, ECOLEX, instituts d'information juridique nationaux, Climate Change Laws of the World, bibliothèque du SBFN. Une source secondaire (presse, cabinet, organisation professionnelle) signale un texte dont l'original n'a pas encore été retrouvé en ligne ; ces entrées sont les premières à vérifier.</p>
<h3>Dates</h3>
<p>La date affichée est celle qui figure dans l'intitulé officiel ou, à défaut, la date de signature, de publication ou d'annonce, précisée dans le résumé. Quand seule l'année est connue avec certitude, seule l'année est affichée. Les dates d'entrée en vigueur sont indiquées dans le résumé quand elles diffèrent.</p>
<h3>Limites</h3>
<p>Le registre couvre 54 des 55 États membres ; la République arabe sahraouie démocratique n'a pas encore été évaluée. Il s'agit d'un échantillon vérifié et non d'un inventaire complet. Les textes en arabe et en portugais ont été identifiés par les bases de référence. Les contributions déterminées au niveau national et les stratégies biodiversité, adoptées par la quasi-totalité des pays, ne sont pas encore saisies pays par pays ; leurs registres officiels figurent dans les Ressources. Les intitulés traduits ne sont pas officiels.</p>
<h3>Situations particulières</h3>
<p>Le registre suit la liste des membres de l'Union africaine et ne prend pas position sur les questions de souveraineté. Le tracé et les noms de la carte n'impliquent aucune reconnaissance de frontière. La République arabe sahraouie démocratique, membre de l'UA, a une fiche et figure en pointillés. Le Somaliland, qui n'est pas membre de l'UA, n'a pas de fiche distincte. Les textes adoptés pendant une transition politique sont recensés avec l'autorité émettrice exacte.</p>`,
en:`
<p>The register records public sustainability texts from the 55 African Union member states, following the list published by the AU, as well as texts of the AU and regional organisations. It covers five themes, whose scope is set out on the Themes page.</p>
<h3>What enters the register</h3>
<p>A text is included if a public authority adopted it: constitution, act, ordinance, decree, order, regulation, directive or guidance from a central bank, regulator or stock exchange, national strategy or policy. A voluntary commitment is included only if a public authority leads or signs it. Charters of professional associations without public endorsement and draft texts are not included.</p>
<h3>How each entry is built</h3>
<ul><li>The text is identified in the country's official sources, then in reference databases.</li><li>The text or its record is opened to note the exact title, number, date and authority.</li><li>Legal force and dedicated or integrated character are assigned for each theme.</li><li>A factual summary is written in English and French, with no judgement on the text's ambition.</li><li>An evidence level is assigned according to the source used.</li></ul>
<h3>Map scale</h3>
<p>For a given theme, a country takes the highest level reached by its national texts: dedicated and binding text, dedicated guidance or voluntary text, provision within a broader text. A country with no recorded text is "not yet assessed". The register never describes a country as having no policy until research is complete. The overview counts the number of themes with data.</p>
<p>The map shows whether texts exist and their legal nature. It does not score their ambition or implementation. A repealed text does not colour the map. Regional texts do not colour countries; they appear on each member state's profile and the map can hatch the zone concerned.</p>
<h3>Evidence levels</h3>
<p>An official source is published by the issuing authority, a parliament or an official gazette. A reference legal database is a recognised registry: FAOLEX, LEAP, ECOLEX, national legal information institutes, Climate Change Laws of the World, the SBFN library. A secondary source (press, law firm, professional body) points to a text whose original has not yet been found online; these entries are first in line for verification.</p>
<h3>Dates</h3>
<p>The date shown is the one in the official title or, failing that, the date of signature, publication or announcement, specified in the summary. Where only the year is certain, only the year is shown. Commencement dates are given in the summary when they differ.</p>
<h3>Limits</h3>
<p>The register covers 54 of the 55 member states; the Sahrawi Arab Democratic Republic has not yet been assessed. It is a verified sample, not a complete inventory. Texts in Arabic and Portuguese were identified through reference databases. Nationally determined contributions and biodiversity strategies, adopted by almost every country, are not yet entered country by country; their official registries are listed under Resources. Translated titles are unofficial.</p>
<h3>Special cases</h3>
<p>The register follows the African Union membership list and takes no position on sovereignty. Boundaries and names on the map do not imply recognition of any border. The Sahrawi Arab Democratic Republic, an AU member, has a profile and is drawn with a dotted outline. Somaliland, which is not an AU member, has no separate profile. Texts adopted during a political transition are recorded with the exact issuing authority.</p>`};



/* ---------- state & helpers ---------- */
let L="fr";try{const s=localStorage.getItem("aspm-lang");if(s==="en"||s==="fr")L=s}catch(e){}
let THEME="ALL",OVER="",SEL=null,DBQ="",CMP=["KEN","NGA","ZAF"],GCF="",SORT={k:"n",d:-1};
const t=k=>T[L][k];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const I=L2=>L2==="fr"?0:1;
const cname=c=>COUNTRIES[c]?COUNTRIES[c][I(L)]:(ORGS[c]?ORGS[c][L]:c);
const thName=k=>THEMES.find(x=>x.k===k)[L];
const title=e=>L==="fr"?(e.tf||e.ti):(e.te||e.ti);
const showOrig=e=>title(e)!==e.ti?e.ti:null;
const fmtDate=d=>{const p=String(d||"").split("-");return p.length===3?p[2]+"."+p[1]+"."+p[0]:p.length===2?p[1]+"."+p[0]:p[0]};
const lvlOf=(e,k)=>{const c=e.th[k];if(!c)return 0;if(c==="i")return 1;return e.f==="b"?3:2};
const nat=DATA.filter(e=>COUNTRIES[e.c]),reg=DATA.filter(e=>!COUNTRIES[e.c]);
function level(c,k){let m=0;for(const e of nat)if(e.c===c&&e.th[k])m=Math.max(m,lvlOf(e,k));return m}
const nThemes=c=>THEMES.filter(x=>level(c,x.k)>0).length;
const mapLevel=c=>THEME==="ALL"?Math.min(3,nThemes(c)):level(c,THEME);
const orgsOf=c=>Object.keys(ORGS).filter(o=>o!=="AU"&&ORGS[o].m.includes(c));
const byName=(a,b)=>cname(a).localeCompare(cname(b),L);
const lvLabel=lv=>[t("lg0"),t("lg1"),t("lg2"),t("lg3")][lv];
const app=document.getElementById("app");

function tags(e,k){
  let h=`<span class="tag ${e.f}">${esc(t("f")[e.f])}</span>`;
  if(k)h+=`<span class="tag">${esc(t("kind")[e.th[k]])}</span>`;
  h+=`<span class="tag ${e.s==="p"?"p":""}">${esc(t("s")[e.s])}</span>`;
  Object.keys(e.th).filter(x=>x!==k).forEach(x=>h+=`<span class="tag th">${esc(thName(x))}</span>`);
  return `<div class="tags">${h}</div>`;
}
function row(e,k,full){
  const o=showOrig(e);
  return `<div class="row"><span class="doc">${esc(e.id)}</span><span class="t">${esc(title(e))}</span><span class="dt">${esc(fmtDate(e.dt))}</span>
  ${full?`<div class="sub">${o?`<p class="orig">${esc(t("official_title"))} : ${esc(o)}</p>`:""}${tags(e,k)}<p class="serif">${esc(L==="fr"?e.sf:e.se)}</p>
  <div class="meta"><span>${esc(e.ty[I(L)])}</span><span>${esc(t("authority"))} : ${esc(e.a)}</span><a href="${esc(e.u)}" target="_blank" rel="noopener">${esc(t("source"))}</a><span class="mono">${esc(t("checked"))}</span></div></div>`
  :`<div class="sub"><span class="meta"><span>${COUNTRIES[e.c]?`<a href="#pays-${e.c}">${esc(cname(e.c))}</a>`:esc(cname(e.c))}</span><span>${esc(t("f")[e.f])}</span><span>${Object.keys(e.th).map(thName).map(esc).join(", ")}</span></span></div>`}
  </div>`;
}
function copyText(txt,statusEl,fallbackEl){
  const fail=()=>{if(fallbackEl){fallbackEl.hidden=false;fallbackEl.value=txt;fallbackEl.focus();fallbackEl.select()}statusEl.textContent=t("copyfail")};
  try{navigator.clipboard.writeText(txt).then(()=>statusEl.textContent=t("copied"),fail)}catch(e){fail()}
}

const crumbs=(...items)=>`<nav class="crumbs" aria-label="Fil d'Ariane"><a href="#carte">${esc(t("home"))}</a>${items.map(([h,l])=>` <span aria-hidden="true">›</span> `+(h?`<a href="#${h}">${esc(l)}</a>`:`<span aria-current="page">${esc(l)}</span>`)).join("")}</nav>`;
const SUBS={pays:[["pays","n_all"],["comparer","n_cmp"],["regional","n_reg"]],apropos:[["apropos","n_proj"],["methodologie","n_m"]]};
const subnav=(g,cur)=>`<nav class="sub" aria-label="${esc(t(g==="pays"?"n_cty":"n_a"))}">${SUBS[g].map(([h,k])=>`<a href="#${h}" ${h===cur?'aria-current="page"':""}>${esc(t(k))}</a>`).join("")}</nav>`;

function viewHome(){
  const nC=new Set(nat.map(e=>e.c)).size,nB=DATA.filter(e=>e.f==="b").length;
  app.innerHTML=`<section class="view">
  <div class="head"><div><p class="lbl">${esc(t("edition"))}</p><h1 style="margin-top:10px">${esc(t("h1"))}</h1><p class="lead">${esc(t("lead"))}</p></div>
   <dl class="figs"><div><dt>${esc(t("fg1"))}</dt><dd>${DATA.length}</dd></div><div><dt>${esc(t("fg2"))}</dt><dd>${nC}</dd></div><div><dt>${esc(t("fg3"))}</dt><dd>${nB}</dd></div><div><dt>${esc(t("fg4"))}</dt><dd>${reg.length}</dd></div></dl></div>
  <nav class="starts" aria-label="Accès rapides"><a href="#pays"><b>${esc(t("st1h"))}</b><span>${esc(t("st1"))}</span></a><a href="#base"><b>${esc(t("st2h"))}</b><span>${esc(t("st2"))}</span></a><a href="#glossaire"><b>${esc(t("st3h"))}</b><span>${esc(t("st3"))}</span></a></nav>
  <div class="bench">
   <div class="tindex"><div class="tlist" role="group" aria-label="${esc(t("th_idx"))}">${tbtn("ALL",t("all"),new Set(nat.map(e=>e.c)).size)}${THEMES.map(x=>tbtn(x.k,x[L],new Set(nat.filter(e=>e.th[x.k]).map(e=>e.c)).size)).join("")}</div>
    <div class="legend" id="legend"></div>
    <label class="legend" for="over"><span class="lbl">${esc(t("overlay"))}</span><select id="over"><option value="">${esc(t("none"))}</option>${["UMOA","CEMAC"].map(o=>`<option value="${o}" ${OVER===o?"selected":""}>${esc(ORGS[o][L])}</option>`).join("")}</select></label></div>
   <div class="mapcol" id="mapcol">${svgMap()}<div class="tip" id="tip" hidden></div><p class="mapnote">${esc(t("mapnote"))}</p></div>
   <aside class="fiche" id="fiche" aria-live="polite"></aside>
  </div>
  <div class="two">
   <div class="sec"><div class="sec-h"><h2>${esc(t("chart_h"))}</h2></div><div class="chart">${chart()}</div><p class="status">${esc(t("chart_n"))}</p></div>
   <div class="sec"><div class="sec-h"><h2>${esc(t("dead_h"))}</h2></div><p class="status">${esc(t("dead_n"))}</p><div class="dl">${DEADLINES.filter(x=>x.d>"2026-10-31").map(x=>`<div><span class="big">${esc(fmtDate(x.d))}</span><span class="serif">${esc(x[L])} <span class="mono muted">${esc(x.id)}</span></span></div>`).join("")}</div></div>
  </div>
  <div class="sec"><div class="sec-h"><h2>${esc(t("new_h"))}</h2><span class="mono muted">${NEWIDS.length}</span></div><div class="reg">${DATA.filter(e=>NEWIDS.includes(e.id)).sort((a,b)=>byName(a.c,b.c)).map(e=>row(e)).join("")}</div></div>
  </section>`;
  app.querySelectorAll(".tbtn").forEach(b=>b.onclick=()=>{THEME=b.dataset.th;app.querySelectorAll(".tbtn").forEach(x=>x.setAttribute("aria-pressed",x===b));paint();fiche()});
  document.getElementById("over").onchange=ev=>{OVER=ev.target.value;paint()};
  bindMap();paint();fiche();
}
const tbtn=(k,lab,n)=>`<button type="button" class="tbtn" data-th="${k}" aria-pressed="${THEME===k}"><span>${esc(lab)}</span><span>${n}</span></button>`;
function svgMap(){
  let p="",h="";
  for(const c in PATHS){p+=`<path class="cty${c==="ESH"?" esh":""}" data-c="${c}" d="${PATHS[c].d}" tabindex="0" role="button"></path>`;h+=`<path class="hatch" data-h="${c}" d="${PATHS[c].d}" hidden></path>`}
  for(const c of ISLANDS){const [x,y]=PATHS[c].c;p+=`<circle class="cty island" data-c="${c}" cx="${x}" cy="${y}" r="7" tabindex="0" role="button"></circle>`}
  return `<svg viewBox="0 0 800 735" role="img" aria-label="${L==="fr"?"Carte des 55 États de l'Union africaine":"Map of the 55 African Union member states"}"><defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V7" stroke-width="2.2"/></pattern></defs><g>${p}</g><g>${h}</g></svg>`;
}
function paint(){
  app.querySelectorAll(".cty").forEach(el=>{const c=el.dataset.c,lv=mapLevel(c);el.setAttribute("class",`cty${c==="ESH"?" esh":""}${el.tagName==="circle"?" island":""} lv${lv}${c===SEL?" sel":""}`);el.setAttribute("aria-label",cname(c)+", "+lvText(lv))});
  const mem=OVER?ORGS[OVER].m:[];app.querySelectorAll(".hatch").forEach(el=>{if(mem.includes(el.dataset.h))el.removeAttribute("hidden");else el.setAttribute("hidden","")});
  const rows=THEME==="ALL"?[[3,t("lgA3")],[2,t("lgA2")],[1,t("lgA1")],[0,t("lg0")]]:[[3,t("lg3")],[2,t("lg2")],[1,t("lg1")],[0,t("lg0")]];
  document.getElementById("legend").innerHTML=rows.map(([k,lab])=>`<div><span class="sw" style="background:var(--m${k});${k?`border-color:var(--m${k})`:""}"></span>${esc(lab)}</div>`).join("")+(OVER?`<div><svg width="16" height="11" aria-hidden="true"><rect width="16" height="11" fill="url(#hatch)" stroke="var(--ochre)"/></svg>${esc(t("lgh"))}</div>`:"");
}
const lvText=lv=>THEME==="ALL"?(lv?(lv>=3?t("lgA3"):lv===2?t("lgA2"):t("lgA1")):t("lg0")):lvLabel(lv);
function bindMap(){
  const box=document.getElementById("mapcol"),tip=document.getElementById("tip");
  app.querySelectorAll(".cty").forEach(el=>{const c=el.dataset.c;
    el.addEventListener("mousemove",ev=>{const r=box.getBoundingClientRect();tip.hidden=false;tip.style.left=(ev.clientX-r.left)+"px";tip.style.top=(ev.clientY-r.top)+"px";tip.textContent=cname(c)+" · "+lvText(mapLevel(c))});
    el.addEventListener("mouseleave",()=>tip.hidden=true);
    const pick=()=>{SEL=c;paint();fiche()};el.addEventListener("click",pick);
    el.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();pick()}});});
}
function fiche(){
  const el=document.getElementById("fiche");if(!el)return;
  if(!SEL){const cs=[...new Set(nat.filter(e=>THEME==="ALL"||e.th[THEME]).map(e=>e.c))].sort(byName);
    el.innerHTML=`<p class="serif muted">${esc(t("hint"))}</p><p class="lbl">${esc(t("cov"))} · ${cs.length}</p><div class="reg">${cs.map(c=>`<div class="row" style="grid-template-columns:minmax(0,1fr) auto"><a href="#pays-${c}">${esc(cname(c))}</a><span class="mono muted">${THEME==="ALL"?nThemes(c)+"/5":esc(lvLabel(level(c,THEME)))}</span></div>`).join("")}</div>`;return}
  const list=nat.filter(e=>e.c===SEL&&(THEME==="ALL"||e.th[THEME])).sort((a,b)=>String(b.dt).localeCompare(String(a.dt)));
  el.innerHTML=`<p class="lbl">${esc(t("R")[COUNTRIES[SEL][2]])}</p><h3>${esc(cname(SEL))}<span class="code">${SEL}</span></h3>
  <p class="muted">${THEME==="ALL"?`${esc(t("themes_in"))} : ${nThemes(SEL)}/5`:esc(thName(THEME))+" · "+esc(lvLabel(level(SEL,THEME)))}</p>
  ${list.length?`<div class="reg">${list.map(e=>`<div class="row" style="grid-template-columns:62px minmax(0,1fr)"><span class="doc">${esc(e.id)}</span><span><span class="t">${esc(title(e))}</span><br><span class="mono muted">${esc(fmtDate(e.dt))} · ${esc(t("f")[e.f])}</span></span></div>`).join("")}</div>`:`<p class="empty">${esc(THEME==="ALL"?t("na"):t("noText"))}</p>`}
  <a class="btn" href="#pays-${SEL}" style="justify-self:start">${esc(t("open"))}</a>`;
}
function chart(){
  const ys={};DATA.forEach(e=>ys[e.y]=(ys[e.y]||0)+1);
  const y0=Math.min(...Object.keys(ys).map(Number)),y1=Math.max(...Object.keys(ys).map(Number));
  const mx=Math.max(...Object.values(ys)),top=Math.ceil(mx/2)*2;
  const W=640,H=240,pl=30,pr=8,pt=12,pb=26,n=y1-y0+1,bw=(W-pl-pr)/n;
  let g="";for(let v=0;v<=top;v+=2){const y=pt+(H-pt-pb)*(1-v/top);g+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${v}</text>`}
  let b="";for(let yr=y0;yr<=y1;yr++){const v=ys[yr]||0;if(v){const h=(H-pt-pb)*v/top;b+=`<rect class="bar${v===mx?" mx":""}" x="${pl+(yr-y0)*bw+1}" y="${H-pb-h}" width="${Math.max(bw-2,1)}" height="${h}"><title>${yr} : ${v}</title></rect>`}
    if(yr%5===0)b+=`<text x="${pl+(yr-y0)*bw+bw/2}" y="${H-8}" text-anchor="middle">${yr}</text>`}
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("chart_h"))}">${g}<line class="axis" x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}"/>${b}</svg>`;
}

function viewCountries(){
  app.innerHTML=`<section class="view">${subnav("pays","pays")}<div><h1>${esc(t("cty_h"))}</h1><p class="serif muted" style="margin-top:12px;max-width:66ch">${esc(t("cty_lead"))}</p></div>
  <div class="tools"><input type="search" id="cq" placeholder="${esc(t("q_cty"))}" aria-label="${esc(t("q_cty"))}"><select id="cr" aria-label="${esc(t("col_r"))}"><option value="">${esc(t("all_regions"))}</option>${Object.entries(t("R")).map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join("")}</select><label class="status"><input type="checkbox" id="co"> ${esc(t("only"))}</label><span class="status" id="cst"></span></div>
  <div class="tw"><table><thead><tr><th><button data-s="c">${esc(t("col_c"))}</button></th><th><button data-s="r">${esc(t("col_r"))}</button></th>${THEMES.map(x=>`<th title="${esc(x[L])}"><button data-s="${x.k}">${esc(x[L].split(" ")[0])}</button></th>`).join("")}<th><button data-s="n">${esc(t("col_n"))}</button></th></tr></thead><tbody id="cb"></tbody></table></div>
  <div class="legend" style="display:flex;flex-wrap:wrap;gap:6px 18px">${[3,2,1,0].map(l=>`<div><span class="cell l${l}"></span> ${esc(lvLabel(l))}</div>`).join("")}</div></section>`;

gs.addEventListener("input",openSugg);gs.addEventListener("blur",()=>setTimeout(closeSugg,150));
gs.addEventListener("keydown",ev=>{const it=[...sg.querySelectorAll("a")];
  if(ev.key==="ArrowDown"||ev.key==="ArrowUp"){if(!it.length)return;ev.preventDefault();sgi=(sgi+(ev.key==="ArrowDown"?1:-1)+it.length)%it.length;it.forEach((a,i)=>a.setAttribute("aria-selected",i===sgi))}
  else if(ev.key==="Enter"){ev.preventDefault();if(sgi>=0&&it[sgi])go(it[sgi].getAttribute("href"),it[sgi].dataset.all);else go("#base",true)}
  else if(ev.key==="Escape")closeSugg()});
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem("aspm-lang",L)}catch(e){}i18n();route()});
window.addEventListener("hashchange",route);i18n();route();
</script>
